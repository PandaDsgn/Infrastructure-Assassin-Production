<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="260" viewBox="0 0 1200 260">
  <style>
    .bg { fill: #fafafa; }
    .brand { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-weight: 800; letter-spacing: -0.03em; }
    .head { fill: #16181a; }
    .red { fill: #8b0000; }
    .tagline { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-weight: 600; letter-spacing: -0.02em; fill: #16181a; }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #06070a; }
      .head { fill: #f2f4f5; }
      .red { fill: #c81e1e; }
      .tagline { fill: #f2f4f5; }
    }
  </style>
  <rect class="bg" width="1200" height="260"/>
  <text x="600" y="130" text-anchor="middle" class="brand head" font-size="56">Infrastructure <tspan class="red">Assassin</tspan></text>
  <text x="600" y="180" text-anchor="middle" class="tagline" font-size="28">Audit it. Flag it. Fix it.</text>
</svg>
